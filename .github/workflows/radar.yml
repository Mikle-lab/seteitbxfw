name: XLM Radar
on:
  schedule:
    - cron: '2,8,14,20,26,32,38,44,50,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: read

concurrency:
  group: xlm-radar-main
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      result: ${{ steps.collect.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run automated tests
        run: python3 -m unittest discover -s tests -v
      - name: Collect and persist Stellar activity
        id: collect
        run: |
          for attempt in 1 2 3; do
            result=success
            if ! python3 -m collector.scan; then
              result=failure
            fi
            git add data
            if git diff --cached --quiet; then
              echo "result=$result" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$(git rev-parse HEAD)
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update Stellar scan data"
            if git push origin HEAD:main; then
              echo "result=$result" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin main
            latest=$(git rev-parse FETCH_HEAD)
            if [ "$latest" = "$base" ] || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git reset --hard "$latest"
          done
      - name: Build static site
        run: python3 -m collector.export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages

  report:
    needs: [scan, deploy]
    if: always() && needs.scan.outputs.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Stellar scan failed; the previous successful checkpoint was retained."
          exit 1
