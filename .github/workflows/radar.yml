name: XLM Radar
run-name: ${{ inputs.auto_at != '' && format('XLM Radar automatic · {0}', inputs.auto_at) || 'XLM Radar' }}
on:
  schedule:
    - cron: '2,8,14,20,26,32,38,44,50,56 * * * *'
  workflow_dispatch:
    inputs:
      auto_at:
        description: UTC Unix slot for the automatic continuation
        type: string
        default: ''
      only_if_stale:
        description: Skip when the last successful scan is under 15 minutes old
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: read

concurrency:
  group: xlm-radar-main
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main' && (inputs.auto_at == '' || vars.RADAR_AUTORUN != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      result: ${{ steps.collect.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check backup dispatch freshness
        id: freshness
        if: inputs.only_if_stale || inputs.auto_at != '' || github.event_name == 'schedule'
        env:
          MINUTES: ${{ inputs.only_if_stale && '15' || '4' }}
        run: echo "fresh=$(python3 -m collector.freshness --minutes "$MINUTES")" >> "$GITHUB_OUTPUT"
      - name: Run automated tests
        if: steps.freshness.outputs.fresh != 'true'
        run: python3 -m unittest discover -s tests -v
      - name: Collect and persist Stellar activity
        id: collect
        if: steps.freshness.outputs.fresh != 'true'
        env:
          RADAR_AUTOMATIC: ${{ inputs.auto_at != '' }}
          RADAR_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.only_if_stale }}
        run: |
          for attempt in 1 2 3; do
            result=success
            if ! python3 -m collector.scan; then
              result=failure
            fi
            git add data
            if git diff --cached --quiet; then
              echo "result=$result" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base=$(git rev-parse HEAD)
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update Stellar scan data"
            if git push origin HEAD:main; then
              echo "result=$result" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin main
            latest=$(git rev-parse FETCH_HEAD)
            if [ "$latest" = "$base" ] || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            git reset --hard "$latest"
          done
      - name: Build static site
        if: steps.freshness.outputs.fresh != 'true'
        run: python3 -m collector.export
      - uses: actions/upload-pages-artifact@v3
        if: steps.freshness.outputs.fresh != 'true'
        with:
          path: dist

  deploy:
    needs: scan
    if: needs.scan.outputs.result != ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages

  telegram:
    needs: [scan, deploy]
    if: needs.scan.outputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deliver recent high-severity alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m collector.notify
      - name: Persist Telegram checkpoint
        run: |
          if [ ! -f data/notifications.json ]; then
            exit 0
          fi
          git add data/notifications.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update Telegram delivery checkpoint"
            if ! git push origin HEAD:main; then
              git fetch --no-tags origin main
              git rebase FETCH_HEAD
              git push origin HEAD:main
            fi
          fi

  continue-schedule:
    if: github.ref == 'refs/heads/main' && inputs.auto_at != '' && vars.RADAR_AUTORUN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Schedule next automatic scan
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ inputs.auto_at }}
        run: |
          next=$(python3 -m collector.timing "$SLOT")
          wait_seconds=$((next - $(date +%s)))
          if [ "$wait_seconds" -gt 0 ]; then
            sleep "$wait_seconds"
          fi
          gh workflow run radar.yml --repo "$GITHUB_REPOSITORY" --ref main -f "auto_at=$next"
          echo "Queued automatic scan for UTC slot $next."

  report:
    needs: [scan, deploy]
    if: always() && needs.scan.outputs.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Stellar scan failed; the previous successful checkpoint was retained."
          exit 1
